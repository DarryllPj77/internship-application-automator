[server]
address = "127.0.0.1"
headless = true
enableStaticServing = true
maxUploadSize = 20

[theme]
base = "light"
primaryColor = "#059669"
backgroundColor = "#D1FAE5"
secondaryBackgroundColor = "#F4FBF8"
textColor = "#064E3B"
borderColor = "#A7F3D0"
dataframeHeaderBackgroundColor = "#F4FBF8"
dataframeBorderColor = "#A7F3D0"
showWidgetBorder = true
baseRadius = "0.5rem"
font = "Inter"
headingFont = "Inter"
codeFont = "JetBrains Mono"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin.woff2"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin.woff2"
weight = "400 500"
style = "normal"
