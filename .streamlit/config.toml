[server]
address = "127.0.0.1"
headless = true
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeBorderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "0.5rem"
font = "Inter"
headingFont = "Inter"
codeFont = "JetBrains Mono"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin.woff2"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin.woff2"
weight = "400 500"
style = "normal"
